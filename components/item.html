<template x-if="$store.app.shouldShowItem">
   <div x-data="listItem">
      <div class="banner">
         <h2 x-text="item.title"></h2>
         <button class="end outline contrast" @click="$store.app.showWishlist()">Close</button>
      </div>
      <div class="banner">
         <div class="hor-view itemRow">
            <template x-for="tag in item.tags" :key="tag">
               <p x-text="tag" class="item"></p>
            </template>
            <p x-text="item.cost" class="item"></p>
         </div>
         <button @click="openURL()" class="end">Shop</button>
      </div>
      <div class="hor-view">
         <template x-for="image in item.images" :key="image">
            <a href="#" @click.prevent="setImage(image)">
               <img :src="getImage(image)" />
            </a>
         </template>
      </div>
      <div>
         <h4>Description</h4>
         <p x-text="item.description"></p>
      </div>
      <template x-if="item.reason.length > 0">
         <div>
            <h4>Reason I'd Like It</h4>
            <p x-text="item.reason"></p>
         </div>
      </template>
      <dialog :open="showImage">
         <article>
            <header>
               <button aria-label="Close" rel="prev" @click="setImage(undefined)"></button>
            </header>
            <img :src="getImage(showImage)" />
         </article>
      </dialog>
   </div>
</template>
